<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" role="img" aria-label="GharKa - Ghar jaisa khana, roz">
  <!-- Tiffin Icon -->
  <g transform="translate(4, 4)">
    <!-- Steam swirls -->
    <path d="M22 6C20 10 24 12 22 16" stroke="#E8830C" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <animate attributeName="d" dur="3s" repeatCount="indefinite" values="M22 6C20 10 24 12 22 16;M23 5C21 9 25 13 23 17;M22 6C20 10 24 12 22 16" />
    </path>
    <path d="M28 4C26 8 30 11 28 15" stroke="#E8830C" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <animate attributeName="d" dur="3.5s" repeatCount="indefinite" values="M28 4C26 8 30 11 28 15;M27 3C25 7 29 12 27 16;M28 4C26 8 30 11 28 15" />
    </path>
    <path d="M34 6C32 10 36 12 34 16" stroke="#E8830C" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <animate attributeName="d" dur="2.8s" repeatCount="indefinite" values="M34 6C32 10 36 12 34 16;M35 5C33 9 37 13 35 17;M34 6C32 10 36 12 34 16" />
    </path>

    <!-- Handle Frame -->
    <path d="M16 26V18C16 14 20 12 28 12C36 12 40 14 40 18V26" stroke="#2F5D3A" stroke-width="3" stroke-linecap="round" />
    <path d="M23 10H33" stroke="#E8830C" stroke-width="3.5" stroke-linecap="round" />

    <!-- Top Container -->
    <rect x="12" y="20" width="32" height="10" rx="3" fill="#2F5D3A" />
    <line x1="14" y1="25" x2="42" y2="25" stroke="#487B55" stroke-width="1.5" />
    
    <!-- Middle Container -->
    <rect x="11" y="32" width="34" height="10" rx="3" fill="#E8830C" />
    <line x1="13" y1="37" x2="43" y2="37" stroke="#FFA73E" stroke-width="1.5" />

    <!-- Bottom Container -->
    <rect x="10" y="44" width="36" height="11" rx="3" fill="#2F5D3A" />
    <line x1="12" y1="49.5" x2="44" y2="49.5" stroke="#487B55" stroke-width="1.5" />

    <!-- Side Fasteners -->
    <rect x="8" y="24" width="3" height="28" rx="1.5" fill="#C86E06" />
    <rect x="45" y="24" width="3" height="28" rx="1.5" fill="#C86E06" />
  </g>

  <!-- Typography -->
  <text x="68" y="36" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="28" fill="#2F5D3A" letter-spacing="-0.5">
    Ghar<tspan fill="#E8830C">Ka</tspan>
  </text>
  
  <text x="69" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="10.5" fill="#716252" letter-spacing="0.4">
    GHAR JAISA KHANA, ROZ.
  </text>
</svg>
